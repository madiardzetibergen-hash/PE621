<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>
        <div class="hyperlinks">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">News</a>
            <a href="#">Contacts</a>
        </div>

        <div class="right-hero">
            <div class="icons">
                <img src="search.svg" alt="search">
                <img src="help.svg" alt="help">
            </div>
            <div class="right-hero-btn">
                <button>Get feedback</button>
            </div>
        </div>

    </div>
    

    <div class="main">
        <div class="hero">
            <div class="hero-leftside">
                <div class="hero-leftside-texts">
                    <div class="hero-leftside-text-h1-h2">
                        <div><h1>Smart Living <br>Starts at Home</h1></div>
                        <div><h2>We install and configure smart home systems <br>that make your home safer, more efficient,<br> and easier to manage.</h2>
                                </div>
                  </div>
                    
                    <div class="benefints">
                        <p>Professional installation and setup</p>
                        <p>Lighting, climate, security, and voice automation</p>
                        <p>Remote control from anywhere</p>
                    </div>
                    
                </div>
                <div class="hero-leftside-btns">
                    <button class="btn-primary">
                        Get feedback
                    </button>
                    <button class="btn-secondary">
                        Explore
                    </button>
                </div>
            </div>

            <div class="hero-rightside">
                <img src="hero-img.png" alt="hero-img">
            </div>
        </div>

        <div></div>
        <div></div>
    </div>
</body>
</html>
